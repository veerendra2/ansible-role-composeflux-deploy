---
# This workflow requires a GALAXY_API_KEY secret in the GitHub repository.
# See: Getting your Galaxy API key — README "Publishing to Ansible Galaxy" section.

name: Release
"on":
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: "veerendra.composeflux_deploy"

jobs:
  release:
    name: Release to Ansible Galaxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "veerendra.composeflux_deploy"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip3 install ansible-core

      - name: Import role to Galaxy
        run: >-
          ansible-galaxy role import --api-key ${{ secrets.GALAXY_API_KEY }}
          $(echo ${{ github.repository }} | cut -d/ -f1)
          $(echo ${{ github.repository }} | cut -d/ -f2)
