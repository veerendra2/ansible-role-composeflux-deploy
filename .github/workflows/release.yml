---
# This workflow requires a GALAXY_API_KEY secret in the GitHub repository.
# See: Getting your Galaxy API key — README "Publishing to Ansible Galaxy" section.

name: Release
"on":
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: "veerendra2.composeflux_deploy"

jobs:
  release:
    name: Release to Ansible Galaxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "veerendra2.composeflux_deploy"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: pip3 install ansible-core

      - name: Import role to Galaxy
        env:
          GALAXY_API_KEY: ${{ secrets.GALAXY_API_KEY }}
        run: |
          test -n "$GALAXY_API_KEY" || { echo "Missing GALAXY_API_KEY secret"; exit 1; }
          ansible-galaxy role import --api-key "$GALAXY_API_KEY" "${GITHUB_REPOSITORY%/*}" "${GITHUB_REPOSITORY#*/}"
