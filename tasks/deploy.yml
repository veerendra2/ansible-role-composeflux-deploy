---
- name: Create ComposeFlux deploy directory
  ansible.builtin.file:
    path: "{{ composeflux_deploy_path }}"
    state: directory
    mode: "0755"

- name: Create git clone directory
  ansible.builtin.file:
    path: "{{ composeflux_git_clone_path }}"
    state: directory
    mode: "0755"
  when: composeflux_git_clone_path | length > 0

- name: Copy SSH deploy key
  ansible.builtin.copy:
    src: "{{ composeflux_ssh_key_local_path }}"
    dest: "{{ composeflux_deploy_path }}/deploy_key"
    mode: "0600"
  when: composeflux_ssh_key_local_path | length > 0
  no_log: true

- name: Template .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ composeflux_deploy_path }}/.env"
    mode: "0600"
  no_log: true

- name: Template compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ composeflux_deploy_path }}/compose.yml"
    mode: "0644"

- name: Deploy ComposeFlux
  community.docker.docker_compose_v2:
    project_src: "{{ composeflux_deploy_path }}"
    pull: always
    state: present
  register: composeflux_deploy_result
