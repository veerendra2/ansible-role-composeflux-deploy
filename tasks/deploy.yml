---
- name: Validate required ComposeFlux variables
  ansible.builtin.assert:
    that:
      - composeflux_git_repo_url | length > 0
      - composeflux_stack_path | length > 0
    fail_msg: >-
      composeflux_git_repo_url and composeflux_stack_path are required.

- name: Create ComposeFlux deploy directory
  ansible.builtin.file:
    path: "{{ composeflux_deploy_path }}"
    state: directory
    mode: "0755"

- name: Create git clone directory
  ansible.builtin.file:
    path: "{{ composeflux_git_clone_path }}"
    state: directory
    mode: "0755"
  when: composeflux_git_clone_path | length > 0

- name: Copy SSH deploy key
  ansible.builtin.copy:
    src: "{{ composeflux_ssh_key_local_path }}"
    dest: "{{ composeflux_deploy_path }}/deploy_key"
    mode: "0600"
  when: composeflux_ssh_key_local_path | length > 0
  no_log: true
  register: composeflux_deploy_key_result

- name: Validate SSH known hosts inputs
  ansible.builtin.assert:
    that:
      - composeflux_ssh_known_hosts is sequence
      - composeflux_ssh_known_hosts is not string
      - composeflux_ssh_known_hosts is not mapping
      - not (composeflux_ssh_known_hosts | length > 0 and composeflux_ssh_known_hosts_local_path | length > 0)
    fail_msg: >-
      composeflux_ssh_known_hosts must be a list of known_hosts lines, and only one of
      composeflux_ssh_known_hosts or composeflux_ssh_known_hosts_local_path may be set.

- name: Write SSH known hosts from inline content
  ansible.builtin.copy:
    content: |
      {% for line in composeflux_ssh_known_hosts %}
      {{ line }}
      {% endfor %}
    dest: "{{ composeflux_deploy_path }}/known_hosts"
    mode: "0644"
  when: composeflux_ssh_known_hosts | length > 0
  register: composeflux_known_hosts_inline_result

- name: Copy SSH known hosts from Ansible controller
  ansible.builtin.copy:
    src: "{{ composeflux_ssh_known_hosts_local_path }}"
    dest: "{{ composeflux_deploy_path }}/known_hosts"
    mode: "0644"
  when: composeflux_ssh_known_hosts_local_path | length > 0
  register: composeflux_known_hosts_local_result

- name: Template .env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ composeflux_deploy_path }}/.env"
    mode: "0600"
  no_log: true

- name: Template compose.yml
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ composeflux_deploy_path }}/compose.yml"
    mode: "0644"

- name: Deploy ComposeFlux
  community.docker.docker_compose_v2:
    project_src: "{{ composeflux_deploy_path }}"
    pull: always
    # Single-file bind mounts keep the old inode when copy atomically replaces
    # the file, so recreate the container to pick up rotated keys.
    recreate: >-
      {{ 'always'
         if (composeflux_deploy_key_result is changed
             or composeflux_known_hosts_inline_result is changed
             or composeflux_known_hosts_local_result is changed)
         else 'auto' }}
    state: present
  register: composeflux_deploy_result
